services:
  - type: web
    name: my-chat-app
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GIGACHAT_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: YANDEX_CLOUD_API_KEY
        sync: false
      - key: YANDEX_CLOUD_FOLDER_ID
        sync: false
