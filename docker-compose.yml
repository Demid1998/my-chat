version: '3.8'

services:
  # Node.js сервер
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: my-chat-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    env_file:
      - ./server/.env
    volumes:
      # Монтируем исходный код для hot reload в разработке
      - ./server:/app
      - /app/node_modules
    networks:
      - my-chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React клиент (для разработки с hot reload)
  client-dev:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: my-chat-client-dev
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - my-chat-network
    depends_on:
      - server
    restart: unless-stopped

  # React клиент (продакшн версия с nginx)
  client-prod:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: my-chat-client-prod
    ports:
      - "8080:80"
    networks:
      - my-chat-network
    depends_on:
      - server
    restart: unless-stopped
    profiles:
      - production

networks:
  my-chat-network:
    driver: bridge

volumes:
  node_modules_server:
  node_modules_client:
